name: Build APK
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create project
        run: |
          flutter create --project-name vpn_app --org com.vpn --platforms=android build_app
          for f in main iran_ai_extras npv_am_extras tg_proxy; do
            [ -f "lib/$f.dart" ] || { echo "ERROR: lib/$f.dart missing"; exit 1; }
            cp "lib/$f.dart" "build_app/lib/$f.dart"
          done
          python3 prepare_android.py

      - name: Add packages
        working-directory: build_app
        run: |
          flutter pub add http flutter_v2ray_client google_mobile_ads shared_preferences installed_apps:1.6.0 permission_handler workmanager url_launcher webview_flutter
          flutter pub get

      - name: Build APK
        working-directory: build_app
        run: |
          printf '\norg.gradle.vfs.watch=false\norg.gradle.daemon=false\norg.gradle.jvmargs=-Xmx3g\n' >> android/gradle.properties
          flutter build apk --release --target-platform android-arm64

      - name: Publish APK as Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: VPN build ${{ github.run_number }}
          files: |
            build_app/build/app/outputs/flutter-apk/*.apk
            build_app/pubspec.lock
